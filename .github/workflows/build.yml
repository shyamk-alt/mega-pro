name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Fix project
        run: |
          cp lib/main.dart /tmp/m.dart || true
          flutter create . --project-name mega_pro --platforms android
          cp /tmp/m.dart lib/main.dart || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mega-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
